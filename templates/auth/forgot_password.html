{% extends "base.html" %}
{% block title %}Forgot Password | Employee Wellness{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card glass-card">
        <i class="fa-solid fa-envelope-circle-check auth-icon"></i>
        <h1>Forgot Password</h1>
        <p class="text-muted">Enter your registered email to generate a development OTP.</p>
        <form method="post">
            <label class="form-label">Email</label>
            <input class="form-control mb-4" name="email" type="email" required>
            <button class="btn btn-primary w-100 btn-lg" type="submit">Generate OTP</button>
        </form>
    </div>
</section>
{% endblock %}
