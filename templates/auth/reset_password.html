{% extends "base.html" %}
{% block title %}Reset Password | Employee Wellness{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card glass-card">
        <i class="fa-solid fa-lock-open auth-icon"></i>
        <h1>Reset Password</h1>
        <form method="post" class="password-rules-form">
            <label class="form-label">New Password</label>
            <div class="input-group mb-2">
                <input class="form-control password-input strength-password" name="password" type="password" required>
                <button class="btn btn-outline-primary toggle-password" type="button" title="Show or hide password"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div class="progress password-progress mb-3"><div class="progress-bar" style="width:0%"></div></div>
            <label class="form-label">Confirm Password</label>
            <input class="form-control confirm-password mb-3" name="confirm_password" type="password" required>
            <div class="password-rules mb-4">
                <span data-rule="length"><i class="fa-regular fa-circle"></i> Minimum 8 Characters</span>
                <span data-rule="upper"><i class="fa-regular fa-circle"></i> One Uppercase Letter</span>
                <span data-rule="lower"><i class="fa-regular fa-circle"></i> One Lowercase Letter</span>
                <span data-rule="number"><i class="fa-regular fa-circle"></i> One Number</span>
                <span data-rule="special"><i class="fa-regular fa-circle"></i> One Special Character</span>
                <span data-rule="match"><i class="fa-regular fa-circle"></i> Password Match</span>
            </div>
            <button class="btn btn-primary w-100 btn-lg" type="submit">Reset Password</button>
        </form>
    </div>
</section>
{% endblock %}
