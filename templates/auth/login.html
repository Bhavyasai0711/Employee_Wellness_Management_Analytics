{% extends "base.html" %}
{% block title %}Login | AI Employee Wellness Analytics{% endblock %}
{% block content %}
<section class="auth-section position-relative overflow-hidden">
    <!-- Ambient Animated Color Orbs -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="auth-card glass-card shadow-lg position-relative z-1 animate-fade-in-up">
        <!-- Top Gradient Accent Line -->
        <div class="auth-card-top-accent"></div>

        <div class="text-center mb-3">
            <div class="auth-avatar-circle mx-auto mb-2 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-user-shield text-indigo fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small mb-0">Login with email or Employee/Admin ID.</p>
        </div>

        <form method="post" novalidate>
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Email or Employee ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-envelope text-indigo"></i></span>
                    <input class="form-control border-start-0 ps-0" name="identifier" type="text" placeholder="e.g. EMP-101 or email@company.com" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock text-indigo"></i></span>
                    <input class="form-control password-input border-start-0 border-end-0 ps-0" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary border-start-0 toggle-password bg-white text-muted" type="button" title="Show or hide password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember">
                    <label class="form-check-label small fw-semibold text-muted" for="remember">Remember me</label>
                </div>
                <a href="{{ url_for('auth.forgot_password') }}" class="small fw-bold text-indigo">Forgot password?</a>
            </div>

            <button class="btn btn-gradient-action w-100 btn-lg shadow-sm" type="submit">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Login to Dashboard
            </button>
        </form>

        <div class="auth-divider my-3"><span class="small text-muted fw-bold">OR</span></div>

        <a class="btn btn-google w-100 btn-lg shadow-sm d-flex align-items-center justify-content-center" href="{{ url_for('auth.google_login') }}">
            <i class="fa-brands fa-google me-2 text-danger"></i>Continue with Google
        </a>

        <p class="text-center mt-3 mb-0 small text-muted">New here? <a href="{{ url_for('auth.signup') }}" class="fw-bold text-indigo">Create account</a></p>
    </div>
</section>
{% endblock %}
